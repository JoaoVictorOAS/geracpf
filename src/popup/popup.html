<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autopreenchimento CPF/CNPJ</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Autopreenchimento CPF/CNPJ</h1>

  <label class="check">
    <input type="checkbox" id="enabledToggle">
    Extensão ativada
  </label>

  <p class="stats">
    Campos encontrados: <span id="fieldsFound">0</span> ·
    preenchidos: <span id="fieldsFilled">0</span>
  </p>

  <button type="button" id="runScanBtn">Preencher página atual</button>

  <fieldset>
    <legend>Documentos salvos</legend>

    <label for="cpfInput">CPF</label>
    <div class="row">
      <input type="text" id="cpfInput" placeholder="000.000.000-00" maxlength="14" autocomplete="off">
      <button type="button" id="genCpfBtn">Gerar</button>
    </div>

    <label for="cnpjInput">CNPJ</label>
    <div class="row">
      <input type="text" id="cnpjInput" placeholder="00.000.000/0000-00" maxlength="18" autocomplete="off">
      <button type="button" id="genCnpjBtn">Gerar</button>
    </div>

    <label class="check">
      <input type="checkbox" id="cnpjAlphanumericToggle">
      CNPJ alfanumérico (novo formato Receita Federal 2026)
    </label>
  </fieldset>

  <fieldset>
    <legend>Preferências</legend>

    <label class="check">
      <input type="checkbox" id="overwriteToggle">
      Sobrescrever campos já preenchidos
    </label>

    <label class="check">
      <input type="checkbox" id="detectNewToggle">
      Detectar novos elementos (SPA)
    </label>

    <label class="check">
      <input type="checkbox" id="applyMaskToggle">
      Aplicar máscara de formatação
    </label>
  </fieldset>

  <button type="button" id="saveBtn">Salvar</button>
  <button type="button" id="openOptionsBtn" class="link">Opções avançadas</button>

  <p id="status" class="status" role="status"></p>

  <script type="module" src="popup.ts"></script>
</body>
</html>
